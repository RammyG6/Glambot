<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ project }} — Playback reel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  html, body { padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { max-width: none; }
  .bg {
    position: fixed; inset: 0;
    background-image: url('{{ url_for("playback_background", project=project) }}');
    background-size: contain; background-position: center; background-repeat: no-repeat;
    opacity: {{ (background_opacity / 100) | round(2) }};
  }
  .frame {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 88vw; height: 82vh;
    background: #000;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.08);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .waiting {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-xl);
    text-align: center; padding: 0 2rem;
  }
  .fs-btn {
    position: fixed; right: 1.5rem; bottom: 1.5rem;
    width: 3rem; height: 3rem; border-radius: 50%;
    background: rgba(29, 29, 31, 0.7); border: 1px solid var(--border);
    color: var(--text); font-size: var(--fs-xl); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.85; transition: opacity .3s ease;
  }
  .fs-btn:hover { opacity: 1; background: rgba(44, 44, 46, 0.85); }
  .fs-btn.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame" id="frame" style="display:none">
    <video id="player" muted autoplay playsinline></video>
  </div>
  <div class="waiting" id="waiting">Waiting for the first clip to be delivered&hellip;</div>
  <button type="button" class="fs-btn" id="fsBtn" title="Toggle full screen">&#x26F6;</button>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var waiting = document.getElementById('waiting');
      var video = document.getElementById('player');
      var fsBtn = document.getElementById('fsBtn');

      var clips = [];
      var currentIndex = 0;
      var lastKnownNewestId = null;
      var paused = false;

      function loadClips(cb) {
        fetch('/projects/{{ project|urlencode }}/playback.json', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (data) { clips = data.clips || []; paused = !!data.paused; cb && cb(); })
          .catch(function () {});
      }

      // Honour the operator's Pause/Resume from the /remote page.
      setInterval(function () {
        loadClips(function () {
          if (paused && !video.paused) { video.pause(); }
          else if (!paused && video.paused && clips.length) { video.play().catch(function () {}); }
        });
      }, 4000);

      function playIndex(i) {
        if (!clips.length) {
          waiting.style.display = '';
          frame.style.display = 'none';
          return;
        }
        waiting.style.display = 'none';
        frame.style.display = '';
        currentIndex = ((i % clips.length) + clips.length) % clips.length;
        lastKnownNewestId = clips[0].id;
        video.src = '/video/' + clips[currentIndex].id;
        video.load();
        video.play().catch(function () {});
      }

      // Never interrupts what's currently playing - only re-evaluated when
      // a clip naturally ends. If a newer clip has arrived since, jump to
      // it; otherwise keep advancing old-ward, wrapping to newest again
      // after the oldest.
      video.addEventListener('ended', function () {
        loadClips(function () {
          if (paused) { return; }
          if (!clips.length) { playIndex(0); return; }
          if (clips[0].id !== lastKnownNewestId) {
            playIndex(0);
          } else {
            playIndex(currentIndex + 1);
          }
        });
      });

      loadClips(function () { playIndex(0); });

      // --- Fullscreen toggle ---
      fsBtn.addEventListener('click', function () {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen().catch(function () {});
        }
      });
      document.addEventListener('fullscreenchange', function () {
        fsBtn.innerHTML = document.fullscreenElement ? '&#x2921;' : '&#x26F6;';
      });

      // --- Auto-hide the fullscreen button after inactivity ---
      var hideTimer = null;
      function showButton() {
        fsBtn.classList.remove('hidden');
        if (hideTimer) { clearTimeout(hideTimer); }
        hideTimer = setTimeout(function () { fsBtn.classList.add('hidden'); }, 3000);
      }
      document.addEventListener('mousemove', showButton);
      showButton();
    })();
  </script>
</body>
</html>
