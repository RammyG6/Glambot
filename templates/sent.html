<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glambot — Sent</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { max-width: 480px; margin: 4rem auto; padding: 0 1.5rem 3rem; text-align: center; }
  img { margin: 1.5rem 0; border-radius: var(--radius); }
  a.back { margin-top: 1.5rem; }
  .link { word-break: break-all; font-size: .85rem; color: var(--text-secondary); }
</style>
</head>
<body>
  <h1>Sent ✓</h1>
  <p>{{ job.project }} / {{ job.filename }} was uploaded and emailed to the recipient.</p>
  <p>Scan to open on another device:</p>
  <img src="{{ qr_data_uri }}" alt="QR code for download link" width="220" height="220">
  <p class="link"><a href="{{ link }}" target="_blank">{{ link }}</a></p>
  {% if link2 %}
  <p>Second version:</p>
  <img src="{{ qr_data_uri2 }}" alt="QR code for second download link" width="220" height="220">
  <p class="link"><a href="{{ link2 }}" target="_blank">{{ link2 }}</a></p>
  {% endif %}
  <a class="back" href="{{ url_for('index') }}">&larr; Back to review queue</a>
</body>
</html>
